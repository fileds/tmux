# Tokyo Night Storm colors
thm_black="#06080a"
thm_bg0="#24283b"
thm_bg1="#282d42"
thm_bg2="#2f344d"
thm_bg3="#333954"
thm_bg4="#3a405e"
thm_bg_red="#ff7a93"
thm_diff_red="#803d49"
thm_bg_green="#b9f27c"
thm_diff_green="#618041"
thm_bg_blue="#7da6ff"
thm_diff_blue="#3e5380"
thm_fg="#a9b1d6"
thm_red="#F7768E"
thm_orange="#FF9E64"
thm_yellow="#E0AF68"
thm_green="#9ECE6A"
thm_blue="#7AA2F7"
thm_purple="#ad8ee6"
thm_grey="#453B6A"
thm_gray="#453B6A"
# Set bg and fg
thm_bg="${thm_bg1}"

# Status bar settings
set -g status "on"
set -g status-bg "${thm_bg1}"
set -g status-fg "${thm_fg}"
set -g status-justify "left"
set -g status-left-length "100"
set -g status-right-length "100"


# Panes
set -g pane-border-style "fg=${thm_fg}"
set -g pane-active-border-style "fg=${thm_blue}"


# Windows
set -g window-status-activity-style "fg=${thm_fg},bg=${thm_bg1},none"
set -g window-status-separator ""
set -g window-status-style  "fg=${thm_fg},bg=${thm_bg1},none"


# Messages
set -g message-style "fg=${thm_cyan},bg=${thm_bg1},align=centre"
set -g message-command-style "fg=${thm_cyan},bg=#{thm_bg1},align=centre"


# Statusline - current window
set -g window-status-current-format "#[fg=${thm_blue},bg=${thm_bg1}] #I: #[fg=${thm_cyan},bg=${thm_bg1}](✓) #[fg=${thm_bg1},bg=${thm_cyan}]#W #[fg=${thm_magenta},bg=${thm_bg1}]"


# Statusline - other windows
set -g window-status-format "#[fg=${thm_blue},bg=${thm_bg1}] #I: #[fg=${thm_fg},bg=${thm_bg1}]#W"


# Statusline - right side
set -g status-right "#[fg=${thm_blue},bg=${thm_bg1},nobold,nounderscore,noitalics]#[fg=${thm_bg1},bg=${thm_blue},nobold,nounderscore,noitalics] #[fg=${thm_bg1},bg=${thm_blue}]#W #{?client_prefix,#[fg=${thm_magenta}],#[fg=${thm_cyan}]}#[bg=${thm_blue}]#{?client_prefix,#[bg=${thm_magenta}],#[bg=${thm_cyan}]}#[fg=${thm_bg1}] #{?client_prefix,#[bg=${thm_magenta}],#[bg=${thm_cyan}]}#[fg=#{thm_bg1}] #S "


# Statusline - left side (indicate if prefix is pressed)
set -g status-left "#{?client_prefix,#[fg=${thm_bg1}]#[bg=${thm_magenta}] \u2388 ,#[fg=${thm_bg1}]#[bg=${thm_bg1}] \u2388 }"


# Modes
set -g clock-mode-colour "${thm_blue}"
set -g mode-style "fg=${thm_blue} bg=${thm_bg3} bold"
